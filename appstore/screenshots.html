<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=block" rel="stylesheet">
<style>
  /* App Store 6.7" portrait: 1290 x 2796 */
  :root {
    --ink: #15191c;
    --cream: #f4eee6;
    --teal: #2f8fa8;
    --rose: #d9a3a0;
    --orange: #ffa53a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1290px; height: 2796px; overflow: hidden; }
  body { font-family: "Inter", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

  .slide { position: relative; width: 1290px; height: 2796px; overflow: hidden; background: var(--cream); }
  .slide.dark { background: var(--ink); }

  /* Ribbon spans slides 1 and 2 as one continuous curve */
  .ribbon { position: absolute; top: 0; width: 2580px; height: 2796px; pointer-events: none; }
  .s1 .ribbon { left: 0; }
  .s2 .ribbon { left: -1290px; }

  /* Hero */
  .hero-glow { position: absolute; inset: 0;
    background:
      radial-gradient(900px 700px at 15% 8%, rgba(47,143,168,.35), transparent 70%),
      radial-gradient(800px 600px at 95% 55%, rgba(255,165,58,.12), transparent 70%); }
  .hero { position: absolute; left: 110px; right: 110px; top: 260px; color: #fff; }
  .hero img { width: 170px; height: 170px; margin-bottom: 70px; opacity: .95; }
  .hero h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 190px; line-height: 1.02; letter-spacing: -3px; }
  .hero h1 .num { display: block; font-size: 440px; line-height: .95; letter-spacing: -8px;
    background: linear-gradient(100deg, #5fc3d6 0%, #f2b6a6 50%, #ffa53a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 20px; }
  .hero p { margin-top: 70px; font-size: 68px; line-height: 1.3; color: rgba(255,255,255,.72); font-weight: 400; max-width: 900px; }
  .brand { position: absolute; left: 110px; bottom: 150px; color: rgba(255,255,255,.9); font-size: 54px; font-weight: 700; letter-spacing: .5px; }

  /* Feature slides */
  .caption { position: absolute; top: 190px; left: 80px; right: 80px; text-align: center; color: var(--ink); z-index: 2; }
  .caption h2 { font-size: 98px; font-weight: 700; letter-spacing: -2px; line-height: 1.08; }
  .caption p { margin-top: 26px; font-size: 64px; font-weight: 400; color: rgba(21,25,28,.7); letter-spacing: -.5px; line-height: 1.2; }
  .phone { position: absolute; left: 50%; top: 620px; width: 1060px; transform: translateX(-50%); z-index: 1;
    filter: drop-shadow(0 50px 70px rgba(60,40,20,.22)); }
</style>
</head>
<body>
<script>
const n = Number(new URLSearchParams(location.search).get('n') || 1);
const ribbon = `
<svg class="ribbon" viewBox="0 0 2580 2796" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="0" y1="2700" x2="1900" y2="1900">
      <stop offset="0" stop-color="#2f8fa8"/>
      <stop offset=".45" stop-color="#e6a9a0"/>
      <stop offset="1" stop-color="#ffa53a"/>
    </linearGradient>
    <path id="p" d="M -200 2150 C 300 1800, 820 1880, 620 2250 C 480 2520, 900 2640, 1290 2160 C 1520 1840, 1760 2050, 1640 2420 C 1580 2600, 1500 2760, 1440 2900"/>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <g fill="none" stroke-linecap="round">
    <use href="#p" stroke="url(#rg)" stroke-width="150" opacity=".5" filter="url(#glow)"/>
    <use href="#p" stroke="url(#rg)" stroke-width="96"/>
  </g>
</svg>`;
const shots = {
  2: ['home.png', 'A promise to<br>start every day', 'Hand-picked verses<br>each time you open the app'],
  3: ['for_you.png', 'Verses chosen<br>just for you', 'Promises picked<br>for your interests'],
  4: ['liked.png', 'Keep your favorites<br>close', 'Save the verses<br>that speak to you'],
  5: ['widget.png', 'God’s Word on<br>your Home Screen', 'A new promise<br>every time you look'],
};
let html;
if (n === 1) {
  html = `<div class="slide dark s1">
    <div class="hero-glow"></div>${ribbon}
    <div class="hero">
      <img src="../images/splash-icon.png" alt="">
      <h1>Discover<span class="num">500+</span>Bible promises</h1>
      <p>For hope, strength and peace — whenever you need them.</p>
    </div>
  </div>`;
} else {
  const [img, h, p] = shots[n];
  html = `<div class="slide s${n}">${n === 2 ? ribbon : ''}
    <div class="caption"><h2>${h}</h2><p>${p}</p></div>
    <img class="phone" src="../images/${img}" alt="">
  </div>`;
}
document.body.innerHTML = html;
</script>
</body>
</html>
